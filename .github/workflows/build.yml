name: Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Extrair projeto e compilar
        shell: bash
        run: |
          set -euo pipefail

          rm -rf FFLauncher
          unzip -oq FFLauncher-project.zip -d .

          if [ ! -d FFLauncher ]; then
            echo "Erro: a pasta FFLauncher não foi criada após extrair o ZIP."
            find . -maxdepth 3 -type f | sed 's#^./##' | head -200
            exit 1
          fi

          GRADLEW="$(find FFLauncher -path '*/gradlew' -type f | head -n 1 || true)"

          if [ -z "${GRADLEW}" ]; then
            echo "Erro: gradlew não foi encontrado dentro do ZIP extraído."
            find FFLauncher -maxdepth 5 -type f | sed 's#^./##' | head -200
            exit 1
          fi

          chmod +x "${GRADLEW}"
          cd "$(dirname "${GRADLEW}")"
          ./gradlew assembleDebug --no-daemon --stacktrace
