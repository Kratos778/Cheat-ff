
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extrair projeto Android
        run: |
          unzip -o FFLauncher-project.zip -d .
          test -f FFLauncher/settings.gradle.kts
          test -f FFLauncher/build.gradle.kts
          test -f FFLauncher/app/build.gradle.kts

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      - name: Compilar APK
        run: gradle -p FFLauncher assembleDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: FFLauncher-debug-apk
          path: FFLauncher/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
