- name: Set up Gradle
  uses: gradle/actions/setup-gradle@v4
  with:
    gradle-version: 8.7

- name: Ensure Gradle wrapper exists
  shell: bash
  run: |
    set -euo pipefail
    if [ ! -f gradlew ]; then
      gradle wrapper --gradle-version 8.7 --distribution-type bin
    fi
    chmod +x gradlew
    ./gradlew -v
