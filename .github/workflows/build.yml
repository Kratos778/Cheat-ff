name: Build and Publish Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Extrair projeto Android
        shell: bash
        run: |
          set -euo pipefail
          rm -rf FFLauncher
          unzip -oq FFLauncher-project.zip -d .
          test -f FFLauncher/settings.gradle.kts
          test -f FFLauncher/build.gradle.kts
          test -f FFLauncher/app/build.gradle.kts

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar SDKs necessários
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME"/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME"/cmdline-tools/latest/bin/sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Tornar gradlew executável
        run: chmod +x FFLauncher/gradlew

      - name: Compilar APK em modo debug
        working-directory: FFLauncher
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Publicar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: FFLauncher-debug-apk
          path: FFLauncher/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publicar APK em release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: FFLauncher/app/build/outputs/apk/debug/app-debug.apk
          draft: false
          generate_release_notes: true
