name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare project source
        id: project
        shell: bash
        run: |
          set -euxo pipefail

          PROJECT_ROOT="."

          if [ -f "FFLauncher-source.zip" ]; then
            mkdir -p extracted
            unzip -q FFLauncher-source.zip -d extracted || {
              echo "Failed to unzip FFLauncher-source.zip"
              exit 1
            }

            # tenta encontrar o projeto Android dentro do zip
            CANDIDATE=$(find extracted -name gradlew -type f 2>/dev/null | head -n 1 | xargs dirname || true)
            if [ -n "$CANDIDATE" ]; then
              PROJECT_ROOT="$CANDIDATE"
            fi
          fi

          # se o projeto não estiver no zip, tenta localizar na raiz do checkout
          if [ ! -f "$PROJECT_ROOT/gradlew" ]; then
            FOUND=$(find . -name gradlew -type f 2>/dev/null | head -n 1 || true)
            if [ -n "$FOUND" ]; then
              PROJECT_ROOT=$(dirname "$FOUND")
            else
              echo "No Android project found. Expected gradlew in repo root or extracted zip."
              exit 1
            fi
          fi

          echo "root=$PROJECT_ROOT" >> "$GITHUB_OUTPUT"
          echo "Project root: $PROJECT_ROOT"

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      - name: Build APK
        shell: bash
        run: |
          set -euxo pipefail
          cd "${{ steps.project.outputs.root }}"
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Publish APK
        uses: actions/upload-artifact@v4
        with:
          name: FFLauncher-debug-apk
          path: |
            ${{ steps.project.outputs.root }}/app/build/outputs/apk/debug/*.apk
            ${{ steps.project.outputs.root }}/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
