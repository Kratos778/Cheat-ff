name: Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Extrair projeto e compilar
        shell: bash
        run: |
          set -euo pipefail

          rm -rf FFLauncher
          unzip -oq FFLauncher-project.zip -d .

          test -f FFLauncher/settings.gradle.kts
          test -f FFLauncher/build.gradle.kts
          test -f FFLauncher/app/build.gradle.kts

          chmod +x FFLauncher/gradlew
          cd FFLauncher
          ./gradlew assembleDebug --no-daemon --stacktrace
