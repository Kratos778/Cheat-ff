name: Android CI/CD

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_type:
        description: "Tipo de build"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release

permissions:
  contents: read

env:
  JAVA_VERSION: "17"
  ANDROID_SDK_VERSION: "35"
  ANDROID_BUILD_TOOLS: "35.0.0"
  GRADLE_VERSION: "8.7"

jobs:
  validate-and-build:
    name: Validate Android project and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate project structure
        shell: bash
        run: |
          set -euo pipefail

          echo "== Root contents =="
          ls -la

          if [ ! -f "build.gradle.kts" ] && [ ! -f "build.gradle" ]; then
            echo "ERROR: build.gradle.kts or build.gradle not found."
            exit 1
          fi

          if [ ! -f "settings.gradle.kts" ] && [ ! -f "settings.gradle" ]; then
            echo "ERROR: settings.gradle.kts or settings.gradle not found."
            exit 1
          fi

          if [ ! -d "app" ] && [ ! -f "gradlew" ]; then
            echo "WARNING: No app/ folder and no gradlew found in repo root."
            echo "The workflow will try to generate the Gradle wrapper if possible."
          fi

          if [ -d "app" ]; then
            echo "Project structure looks valid: app/ exists."
          else
            echo "No app/ folder detected yet. Build may still work if the project is a single-module Gradle app."
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" \
                     "platforms;android-${ANDROID_SDK_VERSION}" \
                     "build-tools;${ANDROID_BUILD_TOOLS}" \
                     "platforms;android-34" \
                     "extra-android-m2repository" \
                     "extra-google-m2repository" \
                     "cmdline-tools;latest"

      - name: Ensure Gradle wrapper exists
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "gradlew" ]; then
            echo "Gradle wrapper already exists."
          else
            echo "Gradle wrapper not found. Generating one..."

            if ! command -v gradle >/dev/null 2>&1; then
              echo "ERROR: gradle command not found. Cannot generate wrapper."
              exit 1
            fi

            gradle wrapper --gradle-version "${GRADLE_VERSION}" --distribution-type bin

            if [ ! -f "gradlew" ]; then
              echo "ERROR: gradlew was not generated successfully."
              exit 1
            fi
          fi

          chmod +x ./gradlew
          ./gradlew -v

      - name: Run unit tests and lint
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew clean testDebugUnitTest lintDebug --stacktrace
        continue-on-error: false

      - name: Build debug APK
        if: ${{ github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == '' }}
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew assembleDebug --stacktrace --no-daemon
        continue-on-error: false

      - name: Build release APK
        if: ${{ github.event.inputs.build_type == 'release' }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ] && [ -n "${{ secrets.KEYSTORE_PASSWORD }}" ] && [ -n "${{ secrets.KEY_ALIAS }}" ] && [ -n "${{ secrets.KEY_PASSWORD }}" ]; then
            echo "Release signing secrets detected. Preparing signing config..."

            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/release-keystore.jks

            cat > keystore.properties <<EOF
            storeFile=app/release-keystore.jks
            storePassword=${{ secrets.KEYSTORE_PASSWORD }}
            keyAlias=${{ secrets.KEY_ALIAS }}
            keyPassword=${{ secrets.KEY_PASSWORD }}
            EOF

            ./gradlew assembleRelease --stacktrace --no-daemon
          else
            echo "No release signing secrets found. Building unsigned release APK instead."
            ./gradlew assembleRelease --stacktrace --no-daemon
          fi

      - name: Upload debug APK artifact
        if: ${{ always() && hashFiles('**/build/outputs/apk/debug/*.apk') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: FFLauncher-debug-apk
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK artifact
        if: ${{ always() && hashFiles('**/build/outputs/apk/release/*.apk') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: FFLauncher-release-apk
          path: |
            **/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FFLauncher-build-reports
          path: |
            **/build/reports/**
            **/build/test-results/**
          if-no-files-found: ignore
