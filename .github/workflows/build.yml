name: Android CI/CD

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_type:
        description: "Tipo de build"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release

permissions:
  contents: read

env:
  JAVA_VERSION: "17"
  ANDROID_SDK_VERSION: "35"
  ANDROID_BUILD_TOOLS: "35.0.0"
  GRADLE_VERSION: "8.7"

jobs:
  validate-and-build:
    name: Validate Android project and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate project structure
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "build.gradle.kts" ] && [ ! -f "build.gradle" ]; then
            echo "ERROR: build.gradle.kts or build.gradle not found."
            exit 1
          fi
          if [ ! -f "settings.gradle.kts" ] && [ ! -f "settings.gradle" ]; then
            echo "ERROR: settings.gradle.kts or settings.gradle not found."
            exit 1
          fi
          if [ ! -d "app" ]; then
            echo "ERROR: app/ directory not found."
            exit 1
          fi
          if [ ! -f "app/build.gradle.kts" ] && [ ! -f "app/build.gradle" ]; then
            echo "ERROR: Android app module configuration not found."
            exit 1
          fi
          echo "Project structure looks valid."

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/android-sdk}}"
          export ANDROID_HOME="${ANDROID_SDK_ROOT}"
          export PATH="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin:${ANDROID_SDK_ROOT}/platform-tools:${PATH}"
          mkdir -p "${ANDROID_SDK_ROOT}"

          if [ ! -x "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "cmdline-tools/latest not found. Installing it manually..."
            mkdir -p "${ANDROID_SDK_ROOT}/cmdline-tools"
            curl -fsSL "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o /tmp/cmdline-tools.zip
            unzip -q /tmp/cmdline-tools.zip -d "${ANDROID_SDK_ROOT}/cmdline-tools"
            rm -rf "${ANDROID_SDK_ROOT}/cmdline-tools/latest"
            if [ -d "${ANDROID_SDK_ROOT}/cmdline-tools/cmdline-tools" ]; then
              mv "${ANDROID_SDK_ROOT}/cmdline-tools/cmdline-tools" "${ANDROID_SDK_ROOT}/cmdline-tools/latest"
            fi
          fi

          if [ ! -x "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "ERROR: sdkmanager not available at ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
            exit 1
          fi

          echo "sdk.dir=${ANDROID_SDK_ROOT}" > local.properties
          yes | "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --install \
            "platform-tools" \
            "platforms;android-${ANDROID_SDK_VERSION}" \
            "build-tools;${ANDROID_BUILD_TOOLS}"

      - name: Run unit tests and lint
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew clean testDebugUnitTest lintDebug --stacktrace --no-daemon

      - name: Build debug APK
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == '' }}
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Build release APK
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.build_type == 'release' }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ] && [ -n "${{ secrets.KEYSTORE_PASSWORD }}" ] && [ -n "${{ secrets.KEY_ALIAS }}" ] && [ -n "${{ secrets.KEY_PASSWORD }}" ]; then
            echo "Release signing secrets detected. Preparing signing config..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/release-keystore.jks
            cat > keystore.properties <<EOF
            storeFile=app/release-keystore.jks
            storePassword=${{ secrets.KEYSTORE_PASSWORD }}
            keyAlias=${{ secrets.KEY_ALIAS }}
            keyPassword=${{ secrets.KEY_PASSWORD }}
            EOF
            ./gradlew assembleRelease --stacktrace --no-daemon
          else
            echo "No release signing secrets found. Building unsigned release APK instead."
            ./gradlew assembleRelease --stacktrace --no-daemon
          fi
